<div class="main-content">
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12">
                <ul class="nav nav-tabs">
                    <li role="presentation" [class.active]="activeTab === 'modules'" (click)="setActive('modules')"><a>Modules</a></li>
                    <li role="presentation" [class.active]="activeTab === 'print'" (click)="setActive('print')"><a>Print</a></li>
                    <li role="presentation" [class.active]="activeTab === 'batch'" (click)="setActive('batch')"><a>Batch/Cashier Closing</a></li>
                    <li role="presentation" [class.active]="activeTab === 'others'" (click)="setActive('others')"><a>Others</a></li>
                    <li role="presentation" [class.active]="activeTab === 'system'" (click)="setActive('system')"><a>System</a></li>
                    <li role="presentation" [class.active]="activeTab === 'employee'" (click)="setActive('employee')"><a>Employee/Timesheet</a></li>
                </ul>
                <ng-container *ngIf="activeTab === 'modules'">
                    <div class="card margin-bottom-0">
                        <div class="content">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_box_barcode" [(ngModel)]="checkbox_box_barcode" [name]="'checkbox_box_barcode'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_box_barcode">Box Barcode Sale Used</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_buying_barcode" [(ngModel)]="checkbox_buying_barcode" [name]="'checkbox_buying_barcode'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_buying_barcode">Buying Barcode Sale Used</label>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_same_code" [(ngModel)]="checkbox_same_code" [name]="'checkbox_same_code'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_same_code">Same Code used for different Products</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_pdcode_pdbarcode" [(ngModel)]="checkbox_pdcode_pdbarcode" [name]="'checkbox_pdcode_pdbarcode'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_pdcode_pdbarcode">PDCode and PDBarcode is the same for scale product</label>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_size_of_upc" [(ngModel)]="checkbox_size_of_upc" [name]="'checkbox_size_of_upc'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_size_of_upc">The size of UPC E code is 8 rather than 6</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_10_digit_barcode" [(ngModel)]="checkbox_10_digit_barcode" [name]="'checkbox_10_digit_barcode'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_10_digit_barcode">10 digit barcode used for UPC A</label>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_price_included" [(ngModel)]="checkbox_price_included" [name]="'checkbox_price_included'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_price_included">Price included barcode is $123.45 style</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_first_5_digit" [(ngModel)]="checkbox_first_5_digit" [name]="'checkbox_first_5_digit'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_first_5_digit">First 5 digit used instead of 6 digit for price included barcode</label>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_sale_price_used" [(ngModel)]="checkbox_sale_price_used" [name]="'checkbox_sale_price_used'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_sale_price_used">Sale Price Used</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                </div>
                            </div>
                            <hr>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_automatic_customer_id" [(ngModel)]="checkbox_automatic_customer_id" [name]="'checkbox_automatic_customer_id'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_automatic_customer_id">Automatic customer ID used</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_customer_info" [(ngModel)]="checkbox_customer_info" [name]="'checkbox_customer_info'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_customer_info">Customer information required</label>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_open_drawer" [(ngModel)]="checkbox_open_drawer" [name]="'checkbox_open_drawer'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_open_drawer">OpenDrawer on Credit payment</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_cash_drawer" [(ngModel)]="checkbox_cash_drawer" [name]="'checkbox_cash_drawer'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_cash_drawer">Cash Drawer Open status checked</label>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_quick_open" [(ngModel)]="checkbox_quick_open" [name]="'checkbox_quick_open'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_quick_open">Quick open cashdrawer needs password</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_debit_over" [(ngModel)]="checkbox_debit_over" [name]="'checkbox_debit_over'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_debit_over">Debit over payment allowed (Cashback)</label>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_cashier_pwd_prompt" [(ngModel)]="checkbox_cashier_pwd_prompt" [name]="'checkbox_cashier_pwd_prompt'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_cashier_pwd_prompt">Cashier password prompted for sale screen access</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_cashier_pwd_always" [(ngModel)]="checkbox_cashier_pwd_always" [name]="'checkbox_cashier_pwd_always'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_cashier_pwd_always">Cashier password always prompted for each transaction</label>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_discount_pwd_prompt" [(ngModel)]="checkbox_discount_pwd_prompt" [name]="'checkbox_discount_pwd_prompt'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_discount_pwd_prompt">Discount password prompted for add discount sale or item</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_sales_helper" [(ngModel)]="checkbox_sales_helper" [name]="'checkbox_sales_helper'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_sales_helper">Sales helper always prompted</label>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_kg_instead" [(ngModel)]="checkbox_kg_instead" [name]="'checkbox_kg_instead'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_kg_instead">Kg instead of lb</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_weight_handled" [(ngModel)]="checkbox_weight_handled" [name]="'checkbox_weight_handled'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_weight_handled">Weight handled as quantity</label>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_24_hour_service" [(ngModel)]="checkbox_24_hour_service" [name]="'checkbox_24_hour_service'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_24_hour_service">24 Hour Service</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_last_item" [(ngModel)]="checkbox_last_item" [name]="'checkbox_last_item'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_last_item">Last item first line displayed</label>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_alt_tab" [(ngModel)]="checkbox_alt_tab" [name]="'checkbox_alt_tab'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_alt_tab">Alt tab is not allowed</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                </div>
                            </div>
                            <hr>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_barcode_auto" [(ngModel)]="checkbox_barcode_auto" [name]="'checkbox_barcode_auto'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_barcode_auto">Barcode generated automatically</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_ar_account" [(ngModel)]="checkbox_ar_account" [name]="'checkbox_ar_account'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_ar_account">AR account is different form customers</label>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_tran_summary" [(ngModel)]="checkbox_tran_summary" [name]="'checkbox_tran_summary'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_tran_summary">Tran summary table used</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_pdcode_manual" [(ngModel)]="checkbox_pdcode_manual" [name]="'checkbox_pdcode_manual'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_pdcode_manual">PD code manual</label>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_product_info" [(ngModel)]="checkbox_product_info" [name]="'checkbox_product_info'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_product_info">Can not update product information</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_canada_penny" [(ngModel)]="checkbox_canada_penny" [name]="'checkbox_canada_penny'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_canada_penny">Canada Penny round used</label>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_event_marketing" [(ngModel)]="checkbox_event_marketing" [name]="'checkbox_event_marketing'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_event_marketing">Event marketing used</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_barcode_not_used" [(ngModel)]="checkbox_barcode_not_used" [name]="'checkbox_barcode_not_used'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_barcode_not_used">Price included barcode not used</label>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="content add-content">
                                    <p class="category"></p>
                                    <button class="btn btn-sm btn-info btn-fill" (click)="onSave()">Save</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </ng-container>
                <ng-container *ngIf="activeTab === 'print'">
                    <div class="card margin-bottom-0">
                        <div class="content">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_receipt_printed" [(ngModel)]="checkbox_receipt_printed" [name]="'checkbox_receipt_printed'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_receipt_printed">Receipt Printed</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_store_copy" [(ngModel)]="checkbox_store_copy" [name]="'checkbox_store_copy'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_store_copy">Store Copy Used</label>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_print_barcode" [(ngModel)]="checkbox_print_barcode" [name]="'checkbox_print_barcode'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_print_barcode">Print Barcode on Receipt</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_techtrex" [(ngModel)]="checkbox_techtrex" [name]="'checkbox_techtrex'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_techtrex">Techtrex Receipt used</label>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_description" [(ngModel)]="checkbox_description" [name]="'checkbox_description'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_description">Description printed</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_store_logo" [(ngModel)]="checkbox_store_logo" [name]="'checkbox_store_logo'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_store_logo">Store logo image used on receipt</label>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_dont_print_customer" [(ngModel)]="checkbox_dont_print_customer" [name]="'checkbox_dont_print_customer'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_dont_print_customer">Do not print customer information on receipt</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_small_size_printer" [(ngModel)]="checkbox_small_size_printer" [name]="'checkbox_small_size_printer'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_small_size_printer">Small size printer font used</label>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_invoice_printing" [(ngModel)]="checkbox_invoice_printing" [name]="'checkbox_invoice_printing'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_invoice_printing">Invoice printing prompted</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_dont_print_second" [(ngModel)]="checkbox_dont_print_second" [name]="'checkbox_dont_print_second'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_dont_print_second">Do not print second product name on receipt</label>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_dont_display" [(ngModel)]="checkbox_dont_display" [name]="'checkbox_dont_display'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_dont_display">Do not display / print sales information on receipt</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_print_product" [(ngModel)]="checkbox_print_product" [name]="'checkbox_print_product'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_print_product">Print product barcode number on receipt</label>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_email_receipt" [(ngModel)]="checkbox_email_receipt" [name]="'checkbox_email_receipt'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_email_receipt">Email receipt</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_print_bill" [(ngModel)]="checkbox_print_bill" [name]="'checkbox_print_bill'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_print_bill">Print bill on Hold</label>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_print_cost" [(ngModel)]="checkbox_print_cost" [name]="'checkbox_print_cost'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_print_cost">Print cost on inventory change report</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_price_not_print" [(ngModel)]="checkbox_price_not_print" [name]="'checkbox_price_not_print'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_price_not_print">Price is not printed on barcode label</label>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_name2_printed" [(ngModel)]="checkbox_name2_printed" [name]="'checkbox_name2_printed'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_name2_printed">Name2 printed on barcode label instead of description</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_vendor_code" [(ngModel)]="checkbox_vendor_code" [name]="'checkbox_vendor_code'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_vendor_code">Vendor and vendor code printed on shelf sticker</label>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="content add-content">
                                    <p class="category"></p>
                                    <button class="btn btn-sm btn-info btn-fill" (click)="onSave()">Save</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </ng-container>
                <ng-container *ngIf="activeTab === 'batch'">
                    <div class="card margin-bottom-0">
                        <div class="content">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_auto_batch_close" [(ngModel)]="checkbox_auto_batch_close" [name]="'checkbox_auto_batch_close'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_auto_batch_close">Automatically batch close at 4:00 AM</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_email_inventory" [(ngModel)]="checkbox_email_inventory" [name]="'checkbox_email_inventory'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_email_inventory">Email inventory report on End of day</label>
                                    </div>
                                </div>
                            </div>
                            <hr>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_batch_report" [(ngModel)]="checkbox_batch_report" [name]="'checkbox_batch_report'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_batch_report">Batch report is not printed</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_batch_all_category" [(ngModel)]="checkbox_batch_all_category" [name]="'checkbox_batch_all_category'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_batch_all_category">Batch: All category printed</label>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_batch_category" [(ngModel)]="checkbox_batch_category" [name]="'checkbox_batch_category'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_batch_category">Batch: Category not included</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_products_under" [(ngModel)]="checkbox_products_under" [name]="'checkbox_products_under'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_products_under">Products under basic stock count are listed on batch report</label>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_summary_for_payment" [(ngModel)]="checkbox_summary_for_payment" [name]="'checkbox_summary_for_payment'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_summary_for_payment">Summary for payment machine included in batch report</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_payment_summary" [(ngModel)]="checkbox_payment_summary" [name]="'checkbox_payment_summary'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_payment_summary">Payment summary is not included in Batch / Account summary report</label>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_cigarette_summary" [(ngModel)]="checkbox_cigarette_summary" [name]="'checkbox_cigarette_summary'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_cigarette_summary">Cigarette summary is not included in Batch / Account summary report</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_not_revenue" [(ngModel)]="checkbox_not_revenue" [name]="'checkbox_not_revenue'" type="checkbox" >
                                        <label class="padding-top-2" for="checkbox_not_revenue">Not revenue category is not included in Account summary report</label>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="checkbox">
                                        <input id="checkbox_sales_person" [(ngModel)]="checkbox_sales_person" [name]="'checkbox_sales_person'" type="checkbox" >
