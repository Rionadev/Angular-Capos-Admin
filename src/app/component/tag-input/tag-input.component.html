<div class="tag-input-container">
    <div class="tags">
      <span class="tag" *ngFor="let tag of tags; let i = index">
        {{ tag }}
        <button type="button" (click)="removeTag(i)">×</button>
      </span>
    </div>
    <input
      type="text"
      [(ngModel)]="tagInput"
      (keydown.enter)="addTag($event)"
      (keydown.backspace)="removeLastTag()"
      placeholder="Add a tag"
    />
</div>
