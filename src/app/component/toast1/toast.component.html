<div class="toast-container">
    <div *ngFor="let toast of toasts" class="toast" [ngClass]="toast.type">
        <span class="glyphicon" 
        [ngClass]="{
            'glyphicon-info-sign': toast.type === 'info',
            'glyphicon-alert': toast.type === 'warning',
            'glyphicon-remove-sign': toast.type === 'error',
            'glyphicon-ok-sign': toast.type === 'success'
          }"></span>
        {{ toast.message }}
    </div>
</div>
