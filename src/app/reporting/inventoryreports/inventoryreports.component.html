<div class="main-content">
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12">
                <!-- Search Bar -->
                <!-- <div class="card margin-bottom-10">
                    <div class="content add-content" style="display: flex; justify-content: flex-end; width: 100%;">
                        <button class="btn btn-sm btn-success btn-fill">
                            Excel
                        </button>
                    </div>
                </div> -->

                <!-- Products Table -->
                <div class="card margin-bottom-10">
                    <div class="content add-content">
                        <div class="align-center">
                            <label class="text-nowrap">Search:</label>
                            <p>&nbsp;&nbsp;</p>
                            <input type="text" [(ngModel)]="searchTerm" class="form-control"
                                placeholder="Poducts or Outlets" (keydown.enter)="searchProducts()" />
                        </div>
                        <div></div>
                    </div>
                </div>    
                <div class="card">
                    <div class="content table-responsive table-full-width" style="overflow-y: auto;max-height: 80vh;">
                        <table class="table table-hover table-striped">
                            <thead>
                                <tr>
                                    <th>Product</th>
                                    <th>Outlet</th>
                                    <th>Current Stock</th>
                                    <th>Item Value</th>
                                    <th>Stock Value</th>
                                    <th>Reorder Point</th>
                                    <th>Reorder Amount</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let item of filteredProducts">
                                    <td>{{ item.name }}</td>
                                    <td>{{ item?.outlet?.name || '' }}</td>
                                    <td>{{ item.inventory }}</td>
                                    <td>{{ item.supply_price | currency }}</td>
                                    <td>{{ item.regular_price | currency }}</td>
                                    <td>{{ item.reorder_point }}</td>
                                    <td>{{ item.reorder_amount }}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
