<div class="main-content">
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12">
                <!-- Search Bar -->

                <!-- Date Picker Selection -->
                <div class="card margin-bottom-10">
                    <div class="content add-content">
                        <div class="align-center">
                            <select class="form-control" [(ngModel)]="selectedPeriod" (change)="updateDateRange()">
                                <option value="today">Today</option>
                                <option value="thisWeek">This Week</option>
                                <option value="thisMonth">This Month</option>
                                <option value="thisYear">This Year</option>
                            </select>
                            
                        </div>
                        <div class="align-center">
                            <input class="form-control" type="date" [(ngModel)]="selectedDateFrom"
                                (change)="fetchSearchItems()" />
                            <p class="category">&nbsp;&nbsp;~&nbsp;&nbsp;</p>     
                            <input class="form-control" type="date" [(ngModel)]="selectedDateTo"
                                (change)="fetchSearchItems()" />
                            <p class="category">&nbsp;&nbsp;</p>  
                            <button class="btn btn-sm btn-danger btn-fill" (click)="clearFilters()">
                                Clear Filter
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Sales Table -->
                <div class="card">
                    <div class="content table-responsive table-full-width" style="max-height: 70vh;overflow-y: auto;">
                        <table class="table table-hover table-striped">
                            <thead>
                                <tr>
                                    <th>Category</th>
                                    <th>Sale</th>
                                    <th>Tax</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><strong>Total</strong></td>
                                    <td><strong>{{ getTotal('sale')|currency }}</strong></td>
                                    <td><strong>{{ getTotal('tax') |currency}}</strong></td>
                                </tr>
                                <tr *ngFor="let record of records" (click)="selrow(record)">
                                    <td>{{ record.category }}</td>
                                    <td>{{ (record.sale||'') |currency}}</td>
                                    <td>{{ (record.tax||'') |currency}}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
